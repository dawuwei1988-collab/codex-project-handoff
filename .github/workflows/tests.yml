name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference crypto for cross-platform tests
        run: python -m pip install cryptography
      - name: Run unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v
      - name: Guard public source files
        env:
          PYTHONUTF8: "1"
        run: python tests/check_publication.py
      - name: Compile exporter
        run: >-
          python -m compileall -q
          plugins/codex-project-handoff/skills/codex-project-handoff/scripts tests
