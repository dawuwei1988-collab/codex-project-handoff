name: Release beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version matching both manifests and runtime
        required: true
        default: 1.1.0-beta.4
        type: string

permissions:
  contents: read

concurrency:
  group: manual-beta-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install cryptography
      - run: python tests/check_publication.py
        env:
          PYTHONUTF8: "1"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: "1"
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - name: Build and verify public assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PYTHONUTF8: "1"
        run: python tests/build_release.py --version "$RELEASE_VERSION"
      - name: Publish a new prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "release-assets/codex-project-handoff-$RELEASE_VERSION-installer.pyz" \
            release-assets/SHA256SUMS.txt release-assets/validation.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Codex Project Handoff $RELEASE_VERSION" \
            --notes-file docs/RELEASE-NOTES.md
